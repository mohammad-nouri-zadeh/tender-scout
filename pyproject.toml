[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tender-scout"
version = "0.1.0"
description = "Classify Italian public tenders by CPV division: classic ML vs embeddings vs LLMs on Amazon Bedrock"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.5",
    "joblib>=1.3",
    "tabulate>=0.9",
]

[project.optional-dependencies]
aws = ["boto3>=1.35"]
dev = ["pytest>=8", "ruff>=0.6", "jupyterlab>=4"]

[tool.setuptools]
packages = ["tender_scout"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
