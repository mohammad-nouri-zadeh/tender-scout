name: CI

on:
  push:
  pull_request:

# The tests need no secrets and never write to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[aws,dev]"
      - run: ruff check .
      - run: pytest -q
